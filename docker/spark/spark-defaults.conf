# Spark -> Iceberg on Nessie, files on MinIO.
#
# Mirrors docker/trino/catalog/iceberg.properties on purpose: same Nessie endpoint,
# same ref, same warehouse. The Spark catalog is also named `iceberg`, so a table is
# spelled iceberg.<ns>.<table> in both engines and a query can move between them
# unchanged.
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.catalog-impl          org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.iceberg.uri                   http://nessie:19120/api/v2
spark.sql.catalog.iceberg.ref                   main
spark.sql.catalog.iceberg.warehouse             s3://mosaic/warehouse
spark.sql.catalog.iceberg.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint           http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access  true
spark.sql.catalog.iceberg.client.region         us-east-1
# Reload table metadata from Nessie on every access. Trino also commits to these tables
# (maintenance, dbt), and a cached Table object would plan the Bronze dedup read
# against a snapshot that is no longer current.
spark.sql.catalog.iceberg.cache-enabled         false

# Timestamps are compared across engines and against source commit times; one zone
# everywhere removes a whole class of off-by-seven-hours bugs (the stack's TZ is
# Asia/Ho_Chi_Minh).
spark.sql.session.timeZone                      UTC

spark.master                                    local[4]
spark.driver.memory                             2g
spark.ui.showConsoleProgress                    false
spark.sql.shuffle.partitions                    8
