# Primary analytics catalog: Iceberg tables on MinIO, catalogued by Nessie.
# Full pushdown support -- this is the catalog the Top-N pushdown experiment (E2) targets.
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.ref=main
iceberg.nessie-catalog.default-warehouse-dir=s3://mosaic/warehouse

# GR1 section 4.3 partitions gold.orders by day(created_at) x bucket(region, 16). A full
# build over the seed's 370 days writes ~3,600 partitions in one statement, and Trino's
# default of 100 open writers per partition fails it (ICEBERG_TOO_MANY_OPEN_PARTITIONS,
# M3). The cap is raised so the spec can be run as written; what the spec costs in file
# count at this scale is recorded in CHANGES-FROM-GR1.
iceberg.max-partitions-per-writer=5000

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
